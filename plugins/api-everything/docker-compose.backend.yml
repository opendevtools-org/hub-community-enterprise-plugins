# Hub installs this file. The image is the published enterprise build.

services:
  api-everything:
    image: ghcr.io/opendevtools-org/api-everything:${API_EVERYTHING_TAG:-enterprise}
    pull_policy: always
    container_name: homelab-api-everything
    restart: unless-stopped
    ports:
      - "${API_EVERYTHING_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 8s
      retries: 8
      start_period: 20s
