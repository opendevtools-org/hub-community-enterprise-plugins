openapi: 3.0.3
info:
  title: api-everything
  version: 0.1.0
  description: Official HTTP API. Swagger UI is served at /swagger.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: The API is up.
  /v1/capabilities:
    get:
      operationId: capabilities
      responses:
        "200":
          description: REST, CLI, and MCP are part of the enterprise image.
  /swagger:
    get:
      operationId: swagger
      responses:
        "200":
          description: Swagger UI.
  /openapi.json:
    get:
      operationId: openapi
      responses:
        "200":
          description: OpenAPI document generated by the API.
